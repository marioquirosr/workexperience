<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario Quirós</title>
<meta name="description" content="Mario Quirós R. Marketing, estrategia e IA para empresas. Comida, opinión y lifestyle para marcas.">
<meta property="og:title" content="Mario Quirós">
<meta property="og:description" content="Elige: el lado profesional o el lado creador.">
<meta property="og:image" content="https://marioquiros.vercel.app/assets/img/og-image.jpg">
<meta property="og:url" content="https://marioquiros.vercel.app/">
<meta name="theme-color" content="#0F2240">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Portada dividida: dos puertas del mismo lenguaje. Izquierda profesional (azul noche + violeta), derecha creador (paleta del mural). */
:root{
  --ink:#0B1426;
  --paper:#F3F2EE;
  --navy:#0F2240;
  --violet:#7F00FF;
  --red:#E8473A;
  --yellow:#F2C65A;
  --sky:#5DB8EC;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font);font-weight:700;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.split{display:flex;min-height:100%;}
.door{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:40px clamp(20px,4vw,56px) 48px;overflow:hidden;transition:flex-grow .45s cubic-bezier(.2,.8,.2,1)}
.door + .door{border-left:3px solid var(--ink)}
.pro{background:var(--navy)}
.cre{background:var(--red);color:var(--ink)}
@media (hover:hover){.split:hover .door{flex-grow:.8}.split .door:hover{flex-grow:1.25}}
.pic{position:absolute;top:96px;width:min(46%,280px);border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--ink)}
.pic{margin:0}
.pic img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}
.cre .pic img{object-position:50% 60%}
.pro .pic{right:clamp(20px,4vw,56px);box-shadow:8px 8px 0 var(--violet);transform:rotate(-2deg)}
.cre .pic{right:clamp(20px,4vw,56px);box-shadow:8px 8px 0 var(--yellow);transform:rotate(2deg)}
.chip{align-self:flex-start;display:inline-block;border:3px solid var(--ink);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ink);position:relative}
.door h2{position:relative;font-weight:900;font-size:clamp(44px,6.4vw,84px);line-height:.92;letter-spacing:-.05em}
.door p{position:relative;font-size:clamp(17px,1.6vw,20px);line-height:1.3;max-width:22em;font-weight:500}
.door p b{font-weight:800}
.go{position:relative;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;margin-top:8px;font-weight:800;font-size:16px;padding:12px 20px;border-radius:99px;border:3px solid var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.pro .go{background:var(--violet);color:#fff;border-color:#fff;box-shadow:4px 4px 0 #fff}
.cre .go{background:var(--ink);color:#fff;box-shadow:4px 4px 0 var(--yellow)}
.door:hover .go{transform:translate(-2px,-2px)}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:20px;pointer-events:none}
.top .chip{pointer-events:auto;font-size:14px;letter-spacing:.04em;text-transform:none;box-shadow:4px 4px 0 var(--ink)}
.tags{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;font-weight:800;border:2px solid currentColor;border-radius:99px;padding:3px 10px}
@media (max-width:760px){
  .split{flex-direction:column}
  .door{min-height:50vh;padding:84px 20px 32px;justify-content:flex-end}
  .door + .door{border-left:0;border-top:3px solid var(--ink)}
  .pic{top:72px;width:34%;right:20px}
  .door h2,.door p,.tags{max-width:58%}
  .door h2{font-size:clamp(32px,9.6vw,46px)}
  .cre{padding-top:40px}
  .cre .pic{top:32px}
}
@media (prefers-reduced-motion:reduce){.door,.go{transition:none}}
</style>
</head>
<body>
<div class="top"><span class="chip">Mario Quirós R.</span></div>
<main class="split">
  <a class="door pro" href="/pro/" aria-label="Entrar al lado profesional">
    <figure class="pic"><img src="/assets/img/hero-800.webp" alt="Mario Quirós dando una charla sobre IA" width="800" height="1000"></figure>
    <span class="chip">Para empresas</span>
    <h2>Profesional</h2>
    <p><b>Estrategia, marketing e IA</b> que se convierte en revenue.</p>
    <div class="tags"><span>Fractional CMO</span><span>Brand to Revenue</span><span>IA aplicada</span></div>
    <span class="go">Entrar →</span>
  </a>
  <a class="door cre" href="/creador/" aria-label="Entrar al lado creador">
    <figure class="pic"><img src="/assets/img/creador.jpg" alt="Mario Quirós frente a un mural en Wynwood" width="900" height="1125"></figure>
    <span class="chip">Para marcas</span>
    <h2>Creador</h2>
    <p><b>Comida, opinión y lifestyle</b> desde Panamá, con ojo de marketero.</p>
    <div class="tags"><span>Opinión</span><span>Foodie</span><span>Lifestyle</span></div>
    <span class="go">Entrar →</span>
  </a>
</main>
</body>
</html>
